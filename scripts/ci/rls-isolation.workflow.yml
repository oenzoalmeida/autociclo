name: RLS isolation

# Testa o isolamento entre usuários (RLS, papéis, funções) em Postgres descartável
# do runner: sem segredos, sem banco real. Stubs mínimos imitam auth/storage do
# Supabase, com auth.uid() lendo request.jwt.claim.sub para simular cada usuário.
on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/test_rls_isolation.sql'
      - '.github/workflows/rls-isolation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rls-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-ephemeral
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7

      - name: Stubs de auth/storage e privilégios padrão do Supabase
        run: |
          psql -v ON_ERROR_STOP=1 -q <<'SQL'
          create role anon nologin; create role authenticated nologin; create role service_role nologin bypassrls;
          create schema if not exists auth; create schema if not exists extensions; create schema if not exists storage;
          grant usage on schema public, auth, storage, extensions to anon, authenticated, service_role;
          create table auth.users(id uuid primary key default gen_random_uuid(), instance_id uuid, aud text, role text, email text unique, encrypted_password text, email_confirmed_at timestamptz, raw_app_meta_data jsonb, raw_user_meta_data jsonb, created_at timestamptz default now(), updated_at timestamptz default now());
          create function auth.uid() returns uuid language sql stable as $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          create function auth.role() returns text language sql stable as $$ select coalesce(nullif(current_setting('request.jwt.claim.role', true), ''), 'anon') $$;
          create table storage.buckets(id text primary key, name text, public boolean, file_size_limit bigint, allowed_mime_types text[]);
          create table storage.objects(id uuid default gen_random_uuid(), bucket_id text, name text, owner uuid);
          alter table storage.objects enable row level security;
          -- No Supabase, o schema public concede tudo a anon/authenticated/service_role por padrão.
          alter default privileges in schema public grant all on tables to anon, authenticated, service_role;
          alter default privileges in schema public grant all on functions to anon, authenticated, service_role;
          alter default privileges in schema public grant all on sequences to anon, authenticated, service_role;
          SQL

      - name: Aplicar migrações em ordem
        run: |
          set -euo pipefail
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "aplicando $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Testar isolamento entre usuários
        run: psql -v ON_ERROR_STOP=1 -f scripts/test_rls_isolation.sql
