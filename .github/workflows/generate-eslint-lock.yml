name: Generate ESLint lockfile

on:
  push:
    branches:
      - fix/eslint-next16

permissions:
  contents: read
  issues: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate package-lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Publish lockfile chunks to temporary issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base64 -w0 package-lock.json > lock.b64
          split -b 45000 -d -a 2 lock.b64 lockpart-
          i=0
          for f in lockpart-*; do
            chunk="$(cat "$f")"
            gh api repos/${GITHUB_REPOSITORY}/issues/12/comments -f body="LOCKPART:${i}:${chunk}"
            i=$((i+1))
          done
          gh api repos/${GITHUB_REPOSITORY}/issues/12/comments -f body="LOCKDONE:${i}"
