name: Generate ESLint lockfile

on:
  push:
    branches:
      - fix/eslint-next16

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate package-lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Publish lockfile
        run: |
          echo '## package-lock.json' >> "$GITHUB_STEP_SUMMARY"
          echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
          cat package-lock.json >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
