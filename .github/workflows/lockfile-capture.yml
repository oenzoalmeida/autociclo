name: Temporary lockfile synchronization
on:
  pull_request:
    paths:
      - package.json
      - .github/workflows/lockfile-capture.yml
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Print sanitized package-lock for repository update
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const raw=fs.readFileSync('package-lock.json','utf8');
          for(let i=0;i<raw.length;i+=3000){
            console.log('LOCK_CHUNK:'+String(i/3000).padStart(4,'0')+':'+raw.slice(i,i+3000).replace(/\n/g,'\\n'));
          }
          console.log('LOCK_CHUNK_END:'+raw.length);
          NODE
