name: Regenerate security lockfile (isolated branch)

on:
  push:
    branches:
      - security/upgrade-next-1643-20261023
    paths:
      - package.json
      - .github/workflows/security-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Regenerate lockfile from npm registry
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install and security audit
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --omit=dev --audit-level=moderate
      - name: Commit lockfile only to security branch
        run: |
          test "$(git branch --show-current)" = "security/upgrade-next-1643-20261023"
          git add -- package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate Next.js security lockfile [skip ci]"
          git push origin HEAD:security/upgrade-next-1643-20261023
